# Railway reads this file on every deploy, so the settings live in the repo
# and not only in the dashboard.
#
# Migrations run at container start (MIGRATE_ON_START=1 on the service): a
# preDeployCommand here was not executed by Railway's config-as-code.

[build]
builder = "DOCKERFILE"

[deploy]
# The new version is published only when /health/ answers 200 (see config/health.py).
healthcheckPath = "/health/"
healthcheckTimeout = 60
